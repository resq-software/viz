<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="ResQ Viz">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1424"/>
      <stop offset="1" stop-color="#070b14"/>
    </linearGradient>
    <linearGradient id="cy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#35E0F0"/>
      <stop offset="1" stop-color="#2BA8FF"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- hex mesh boundary -->
  <polygon points="256,108 372,176 372,336 256,404 140,336 140,176"
           fill="none" stroke="url(#cy)" stroke-width="16" stroke-linejoin="round" opacity="0.9"/>
  <!-- mesh links -->
  <g stroke="url(#cy)" stroke-width="8" opacity="0.5">
    <line x1="256" y1="256" x2="196" y2="190"/>
    <line x1="256" y1="256" x2="320" y2="196"/>
    <line x1="256" y1="256" x2="256" y2="338"/>
  </g>
  <!-- swarm nodes -->
  <g fill="url(#cy)">
    <circle cx="256" cy="256" r="30"/>
    <circle cx="196" cy="190" r="16"/>
    <circle cx="320" cy="196" r="16"/>
    <circle cx="256" cy="338" r="16"/>
  </g>
</svg>
