# Bake-time licence gate. See tools/licences/README.md.
#
# Action refs are pinned to SHAs to match the repo's blanket policy (zizmor:
# unpinned-uses). The version comment is the tag that SHA corresponds to.

name: licence-gate

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Don't leave a credentialed `.git/config` on disk (zizmor: artipacked).
          # The staleness step below uses `git status`, which needs no credentials.
          persist-credentials: false
          # Baked tiles may be in LFS; the gate hashes real bytes, and a pointer
          # file would hash to something the manifest never recorded.
          lfs: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
          # This job runs no `npm install` — it only needs the Node runtime for
          # `--experimental-strip-types`. Leaving the dependency cache off avoids
          # restoring a cache into a build that publishes artifacts
          # (zizmor: cache-poisoning).
          package-manager-cache: false

      # Runs BEFORE the gate. A gate whose own rules are inert reports success on
      # data it should have rejected, and that failure mode is invisible from the
      # gate's own output — the suite is the only thing that can see it.
      - name: Gate self-test
        run: node --experimental-strip-types --test tools/licences/check-licences.test.ts

      - name: Validate manifest against schema
        run: |
          npx --yes ajv-cli@5.0.0 validate \
            -s tools/licences/manifest.schema.json \
            -d data/manifest.json \
            --spec=draft2020 --strict=false

      - name: Licence gate
        run: |
          node --experimental-strip-types tools/licences/check-licences.ts \
            --root . --registry tools/licences/licences.json \
            --manifest data/manifest.json --emit-notice NOTICE.md

      - name: Fail if NOTICE is stale
        # `git diff --quiet` exits 0 for an UNTRACKED file, so on the first run —
        # or on any branch where NOTICE.md was never committed — the generated
        # notice was silently accepted and never compared to anything. Verified:
        # with NOTICE.md untracked, `git diff --quiet -- NOTICE.md` returns 0.
        # `git status --porcelain` reports `?? NOTICE.md`, and stays empty when the
        # regenerated file is byte-identical, so it catches the missing case
        # without false-positives on a clean run.
        run: |
          status="$(git status --porcelain -- NOTICE.md)"
          if [ -n "$status" ]; then
            echo "::error::NOTICE.md is missing or out of date. Re-run the gate locally and commit the result."
            echo "git status: $status"
            git --no-pager diff -- NOTICE.md || true
            exit 1
          fi

  # --strict promotes "licence text not hashed" and "licence never read against
  # its publisher page" from warnings to errors.
  #
  # TIMING, because it is easy to misread: `release: types: [published]` fires
  # AFTER the release exists, so this job can never PREVENT a publication. It is
  # a post-publication audit. The job that actually blocks is `gate` above, which
  # runs on every pull_request and on push to main — that is where a bad source
  # is stopped, and it is not advisory.
  #
  # This one stays advisory because the register honestly records
  # `verified_on: null` for sources nobody has read yet, so it fails today by
  # design: 13 unhashed-licence + 13 unverified-source on the current tree.
  # Making it blocking now would fail an unrelated release without telling
  # anyone anything new. Flip `continue-on-error` to false once every
  # shipped-path source carries a `verified_on` date and a `licence_text_sha256`
  # — that is when "we read the licence" becomes enforceable rather than
  # asserted. To gate publication itself rather than audit it, the check has to
  # move into the release-producing workflow, ahead of the upload step.
  gate-strict:
    if: github.event_name == 'release'
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          lfs: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Licence gate (strict — post-publication audit, advisory)
        run: |
          node --experimental-strip-types tools/licences/check-licences.ts \
            --root . --registry tools/licences/licences.json \
            --manifest data/manifest.json --strict
