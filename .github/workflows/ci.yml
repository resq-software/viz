#
# Comprehensive CI. Three parallel streams converge into the `required`
# aggregator that the org ruleset `default-branch-baseline` watches:
#
#   gates          — org-wide reusable: dotnet build/test/format + security scan
#   client         — org-wide reusable: node-ci (install + tsc + vite build)
#   client-budget  — bundle-size enforcement + wwwroot artifact upload
#   browser        — Playwright/Chromium against two real Kestrel servers
#
# `browser` needs `gates` and `client-budget` — and so, through
# `client-budget`, `client` as well. It is serialized rather than run beside
# them because it consumes the wwwroot artifact `client-budget` uploads, and
# because it is the only job that needs a GPU-capable runner.
#
# The org's `node-ci.yml` gained `cache-dependency-path` support in
# resq-software/.github#19, which unblocked viz's subdirectory lockfile
# (src/ResQ.Viz.Web/package-lock.json). Prior hand-rolled inline job
# replaced with the shared reusable so viz inherits the org's
# SHA-pinned actions + step-security/harden-runner + unified timeout
# policy automatically.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Workflow-level baseline is intentionally read-only. Each job below
# grants the narrowest scope it actually needs (zizmor: excessive-permissions).
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Backend (C#) + security ──────────────────────────────────────────
  gates:
    permissions:
      contents: read
      security-events: write   # required.yml dispatches CodeQL + uploads SARIF
      pull-requests: read      # security-scan reads PR metadata for diff scans
    uses: resq-software/.github/.github/workflows/required.yml@23ce94eabddf963835624451e89baca7ac9db541
    with:
      lang: dotnet
      dotnet-solution: ResQ.Viz.sln
      codeql-languages: '["csharp"]'
      submodules: recursive
    # No `secrets:` block on purpose (zizmor secrets-inherit). required.yml
    # declares no `workflow_call` secrets, so they cannot be forwarded by name;
    # it only relays them to security-scan.yml, where each is gated behind an
    # `enable-*` input. This call leaves enable-semgrep / enable-gitleaks /
    # enable-snyk / enable-vet at their `false` defaults — those jobs report
    # "skipping" on every run — so nothing downstream reads a secret. CodeQL,
    # osv-scanner, dependency-review, zizmor and actionlint need none; they use
    # the automatic GITHUB_TOKEN, which `permissions:` above grants directly.
    # Semgrep runs on this repo via security.yml, which forwards its token by
    # name. Enabling a secret-backed scanner here means declaring the secret in
    # required.yml upstream first.

  # ── Frontend (TypeScript / Vite) — via org reusable ──────────────────
  # Consumes node-ci.yml directly (not via required.yml) because
  # required.yml dispatches based on `lang:` — viz already calls it as
  # `lang: dotnet` for the backend stream, and a second `lang: node`
  # dispatch would duplicate the security-scan job. Direct use of
  # node-ci.yml skips that.
  client:
    permissions:
      contents: read
    uses: resq-software/.github/.github/workflows/node-ci.yml@23ce94eabddf963835624451e89baca7ac9db541
    with:
      package-manager: npm
      node-version: "22"
      working-directory: src/ResQ.Viz.Web
      cache-dependency-path: src/ResQ.Viz.Web/package-lock.json
      install-cmd: npm ci --legacy-peer-deps
      typecheck-cmd: npx tsc --noEmit
      build-cmd: npx vite build
      timeout-minutes: 10
    # No `secrets:` block on purpose (zizmor secrets-inherit): node-ci.yml
    # declares no `workflow_call` secrets and reads none, so `secrets: inherit`
    # handed it every secret this repo can see in exchange for nothing.

  # ── Bundle-size budget + artifact upload (companion) ─────────────────
  # The reusable node-ci doesn't expose bundle outputs or artifact
  # upload, so this job rebuilds the client on a cache-warm runner
  # (~15 s) and enforces the ceiling. Depends on `client` so a failing
  # tsc/build stops the pipeline before wasting a second build.
  #
  # Bundle budgets in bytes, read and enforced by
  # scripts/check-bundle-size.mjs, so `npm run bundle:check` reproduces this
  # gate locally instead of it existing only inside a workflow file. The
  # measured build is 576,486 B JS (70% of 800 KB) and 43,810 B CSS (82% of
  # 52 KB). Bumping either is a policy decision.
  client-budget:
    needs: client
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: src/ResQ.Viz.Web
    env:
      BUNDLE_JS_BUDGET_BYTES: '819200'    # 800 KB
      # 50 → 52 KB: the flight-cockpit + drone-HUD work adds core UI CSS. The
      # deferrable cockpit/instrument styles were moved to a lazy chunk
      # (ui/cockpit.css) and mono trimmed to its latin subset first; the entry
      # CSS sits at ~50.1 KB, so this is a small headroom bump, not slack.
      BUNDLE_CSS_BUDGET_BYTES: '53248'    # 52 KB
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Don't leave a credentialed `.git/config` on disk; the artifact
          # upload step below would otherwise risk packing the token
          # alongside wwwroot/ (zizmor: artipacked).
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/ResQ.Viz.Web/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run client tests
        # Vitest unit tests for the host-side WebGPU primitives (ray
        # packing roundtrip, LidarScan validation). No browser / GPU —
        # ~350 ms on a cache-warm runner. Stops the pipeline before
        # the bundle measure if a primitive regressed.
        run: npm test

      - name: Build (cache-warm)
        run: npx vite build

      - name: Measure + enforce bundle-size budget
        # The script's stdout is the Markdown report and its stderr carries the
        # ::error::/::notice:: annotations, so the summary renders as a table
        # rather than as workflow-command syntax. `--silent` suppresses npm's
        # `> resq-viz-client@1.0.0 bundle:check` banner, which tee would
        # otherwise paste into the summary as a stray blockquote. `pipefail`
        # is what makes an over-budget exit code survive the pipe.
        run: |
          set -euo pipefail
          npm run --silent bundle:check | tee -a "$GITHUB_STEP_SUMMARY"

      # Uploaded BEFORE the advisory audit, deliberately: the `browser` job
      # downloads this artifact, so producing it must not sit behind a step that
      # is explicitly allowed to fail. It previously sat after the audit, and
      # when a slow `npm audit` ran the job into its 10-minute ceiling the upload
      # was skipped — taking `browser` (skipped, no artifact to download) and
      # `required` down with it, after the budget check had already passed.
      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: viz-wwwroot-${{ github.sha }}
          path: src/ResQ.Viz.Web/wwwroot/
          retention-days: 7

      - name: Advisory audit (non-blocking)
        # Surfaces high-severity npm advisories for visibility without
        # blocking PRs. Socket Security (via security-scan.yml) is the
        # enforcing gate for supply chain.
        #
        # `continue-on-error` only forgives a non-zero exit; it does nothing
        # about wall clock. Without a bound of its own this step can still spend
        # the job's whole remaining budget and have the runner cancel everything
        # after it. Two minutes is ample for a registry that is answering, and
        # irrelevant against the 10-minute job ceiling when it is not.
        continue-on-error: true
        timeout-minutes: 2
        run: npm audit --audit-level=high --legacy-peer-deps

  # ── Operator console in a real browser (Playwright / Chromium) ──────
  # Serialized behind `gates` and `client-budget`: it runs the Debug host that
  # `gates` proves compiles, and it downloads the exact wwwroot that
  # `client-budget` measured, so the bytes under test are the bytes the budget
  # passed rather than a second, separately-built copy of them.
  #
  # THIS JOB RUNS THE CONSOLE WITH ITS 3D SCENE NOT DRAWING, AND THAT IS A REAL
  # REDUCTION IN WHAT IT COVERS. Both servers started by `playwright.config.ts`
  # set `BrowserVerification:SuspendSceneRendering`, so the page builds the
  # scene, the renderer and the canvas and then skips the draw at the end of each
  # animation frame. Nothing here verifies a shader, a draw call, the
  # post-processing chain, the onboard picture-in-picture, or any regression
  # whose only symptom is a wrong pixel. What it does verify is what these four
  # specs claim: reachability, layout and stacking, hit targets, focus
  # containment, the legacy transport fallback, and DVR retention.
  #
  # Why. `ubuntu-latest` has no GPU, so Chromium rasterises in software, and a
  # full-screen terrain-and-water scene drawn that way saturates the main thread.
  # The application survived that — every spec in runs 33851821089 and
  # 33862263781 booted, connected and rendered a correct populated console — but
  # Playwright did not, because its DOM snapshotter runs inside the page and
  # queues behind the draw. In run 33862263781 every before/after snapshot cost
  # 11.2-12.2 s at 1440x900, flat against its own size (407 bytes: 12.18 s;
  # 82,689 bytes: 12.10 s) and proportional to viewport pixels (3.6 s at
  # 390x844). That put 34-51% of each spec's wall clock inside instrumentation,
  # and it scaled with the number of calls a test reached — so each budget
  # increase bought more calls at ~23 s apiece and failed later, twice.
  #
  # Suspending the draw was measured against a Chromium deliberately forced onto
  # SwiftShader, which is this runner's rasteriser: with it, the four specs pass
  # in 29.3 s; without it, the desktop spec fails on the clock exactly as it does
  # here. The budgets in `playwright.config.ts` came down accordingly.
  #
  # Moving this job to a GPU-backed runner would let the setting be dropped and
  # would restore the rendering coverage lost above; a runner change is a gate
  # change either way.
  browser:
    needs: [gates, client-budget]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: src/ResQ.Viz.Web
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # ResQ.Viz.Web references four projects under lib/dotnet-sdk; without
          # the submodule there is nothing for the Debug build to compile
          # against and every webServer start fails as "connection refused".
          submodules: recursive
          # Same reason as client-budget: the report upload below must not be
          # able to pack a credentialed .git/config (zizmor: artipacked).
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/ResQ.Viz.Web/package-lock.json

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Download the measured client build
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          name: viz-wwwroot-${{ github.sha }}
          path: src/ResQ.Viz.Web/wwwroot/

      - name: Build the host (Debug, no Vite)
        # The csproj's ViteBuild target is conditioned on Release, so Debug
        # compiles C# only and leaves the downloaded wwwroot untouched. The
        # `--no-build` servers in playwright.config.ts need this to have run:
        # letting `dotnet run` build instead would have the two servers racing
        # each other for the same output directory.
        run: dotnet build ResQ.Viz.Web.csproj -c Debug

      - name: Export an HTTPS certificate for the test servers
        # SessionController issues the `viz_session` cookie with Secure=true,
        # so a plain-HTTP origin gets no room and every room-scoped route
        # answers 401. Supplying the PFX through the environment takes
        # run-browser-tests.sh's reuse path: it creates no temporary directory
        # and its cleanup trap has nothing to remove.
        run: |
          set -euo pipefail
          pfx="${RUNNER_TEMP}/resq-browser-verification.pfx"
          password="$(openssl rand -hex 24)"
          echo "::add-mask::${password}"
          dotnet dev-certs https --export-path "$pfx" \
            --password "$password" --format Pfx
          echo "RESQ_BROWSER_PFX=${pfx}" >> "$GITHUB_ENV"
          echo "RESQ_BROWSER_PFX_PASSWORD=${password}" >> "$GITHUB_ENV"

      - name: Run the browser suite
        # `retries: 0` in playwright.config.ts is deliberate and should stay
        # that way, but not for the reason this comment used to give. It claimed
        # a retry would exhaust the process-wide 10-per-minute `destructive`
        # rate limiter and leave a room connected, empty and missionless. The
        # traces from run 33851821089 refute that: every request on that limiter
        # answered 200, and the busiest 60-second window held four of them.
        #
        # The real reason is that a retry hides exactly the kind of slow, real
        # regression this suite exists to catch. That reason held when a spec
        # here cost minutes and still holds now that it costs seconds: this suite
        # waits on state rather than on time, so a spec that needs a second
        # attempt is telling us something, and re-running it discards the report.
        run: npm run test:browser

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: viz-playwright-report-${{ github.sha }}
          path: |
            src/ResQ.Viz.Web/playwright-report/
            src/ResQ.Viz.Web/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # ── Aggregate gate watched by the org ruleset ───────────────────────
  required:
    name: required
    runs-on: ubuntu-latest
    needs: [gates, client, client-budget, browser]
    permissions: {}    # pure aggregator: only reads needs.*.result env vars
    if: always()
    steps:
      - name: Assert all upstream jobs passed or were skipped
        env:
          GATES:   ${{ needs.gates.result }}
          CLIENT:  ${{ needs.client.result }}
          BUDGET:  ${{ needs.client-budget.result }}
          BROWSER: ${{ needs.browser.result }}
        run: |
          set -eu
          ok() { case "$1" in success|skipped|"") return 0;; *) return 1;; esac; }
          fail=0
          ok "$GATES"   || { echo "::error::gates=$GATES";          fail=1; }
          ok "$CLIENT"  || { echo "::error::client=$CLIENT";        fail=1; }
          ok "$BUDGET"  || { echo "::error::client-budget=$BUDGET"; fail=1; }
          ok "$BROWSER" || { echo "::error::browser=$BROWSER";      fail=1; }
          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "ok: gates=$GATES client=$CLIENT budget=$BUDGET browser=$BROWSER"
