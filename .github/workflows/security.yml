#
# Thin caller for the org-wide reusable security-scan workflow in
# resq-software/.github.

name: security

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  # `actions: read` is required by the reusable workflow's SARIF-uploading jobs
  # (they declare it for github/codeql-action telemetry, which zizmor's
  # upload-sarif step calls). An explicit permissions block sets every unlisted
  # scope to `none`, so without this the nested jobs request more than the
  # caller grants and the run is rejected at creation (startup_failure).
  # Read-only; grants no write capability.
  actions: read
  contents: read
  security-events: write
  pull-requests: read

jobs:
  scan:
    # Skip on Dependabot PRs: Dependabot's restricted context resolves Actions
    # secrets to empty, so semgrep would fail to authenticate on every one of
    # its PRs. Dependabot already vetted the bump; push/schedule still scan the
    # default branch.
    if: ${{ github.actor != 'dependabot[bot]' }}
    uses: resq-software/.github/.github/workflows/security-scan.yml@44987ffd6eb5b1aa9d0a0d39e8dde9d669fe1d84 # main
    with:
      # `languages` is deliberately omitted. It defaults to "[]", and
      # security-scan gates its CodeQL job on
      #   if: ${{ inputs.languages != '' && inputs.languages != '[]' }}
      # so the job is skipped rather than run-and-discarded.
      #
      # Code-scanning *default setup* is enabled on this repository, and
      # GitHub refuses advanced-setup CodeQL uploads while it is. This job
      # logged, on every run:
      #   Analysis upload status is failed.
      #   CodeQL analyses from advanced configurations cannot be processed
      #   when the default setup is enabled
      #   CodeQL job status was configuration error.
      # and still reported success — the reusable carries
      # `continue-on-error: true` on its analyze step and the rejection is
      # emitted in the post-job phase, so a configuration error had become a
      # permanent green check.
      #
      # Coverage is unchanged: every stored CodeQL analysis here already
      # comes from default setup, which runs the broader `extended` query
      # suite rather than the default suite this job used.
      submodules: recursive
      # This repo has no SAST otherwise: unlike some sibling repos it is not a
      # project in the Semgrep managed app, so no `semgrep-cloud-platform/scan`
      # check runs on its PRs. The reusable's semgrep runs in a container on
      # ubuntu-latest, which is fine here — this caller does not route to the
      # self-hosted runners, which is the constraint that makes the repos that
      # do route there opt out.
      enable-semgrep: true
    # Forward by name instead of `secrets: inherit` (zizmor secrets-inherit):
    # the reusable declares every secret it can consume, and semgrep is the only
    # optional scanner enabled here, so SEMGREP_APP_TOKEN is the only one it
    # needs. gitleaks / snyk / vet stay off, so their secrets stay unshared.
    secrets:
      SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
