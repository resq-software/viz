#
# Weekly dependency updates, grouped to keep PR noise low.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:17"
    groups:
      github-actions:
        patterns: ["*"]
    ignore:
      # The gh-aw setup action is version-locked to the compiler that generated
      # our *.lock.yml files — bumping it on its own desyncs the body from the
      # action that materialises its helper scripts, and every agentic workflow
      # then dies with MODULE_NOT_FOUND. Upgrade via `gh aw compile`, never via
      # Dependabot.
      #
      # The trailing `*` matters: Dependabot names an action by its full path,
      # so the dependency is `github/gh-aw-actions/setup`. A bare
      # `github/gh-aw-actions` matches nothing — that silent no-op is exactly
      # what broke resq-software/crates and resq-software/resQ.
      - dependency-name: "github/gh-aw-actions*"
    labels: [chore, deps]
    open-pull-requests-limit: 5
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:17"
    groups:
      nuget:
        patterns: ["*"]
    labels: [chore, deps]
    open-pull-requests-limit: 5
  # Frontend (Three.js + Vite + SignalR + @resq-sw/*). Lives under
  # src/ResQ.Viz.Web alongside the ASP.NET Core project; Dependabot
  # discovers package.json + package-lock.json there. `@resq-sw/*` are
  # grouped so fleet-wide library bumps arrive as one PR instead of
  # five separate ones.
  - package-ecosystem: npm
    directory: /src/ResQ.Viz.Web
    schedule:
      interval: weekly
      day: monday
      time: "06:17"
    groups:
      resq-sw:
        patterns: ["@resq-sw/*"]
      frontend:
        patterns: ["*"]
        exclude-patterns: ["@resq-sw/*"]
    labels: [chore, deps]
    open-pull-requests-limit: 5
  # lib/dotnet-sdk is a git submodule pinned to a release tag; this
  # surfaces SDK tag bumps so we don't drift behind the upstream.
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:17"
    labels: [chore, deps]
    open-pull-requests-limit: 2
