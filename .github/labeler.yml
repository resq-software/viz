# viz is a single-project repo (ASP.NET Core web app + embedded Vite/TS
# client), not a monorepo, so labels are area:* per source area rather
# than pkg:* per package dir.

# -- Area labels ----------------------------------------------------------

"area:backend":
  - changed-files:
    - any-glob-to-any-file:
      - src/ResQ.Viz.Web/**/*.cs
      - src/ResQ.Viz.Web/*.csproj
      - src/ResQ.Viz.Web/appsettings*.json

"area:client":
  - changed-files:
    - any-glob-to-any-file:
      - src/ResQ.Viz.Web/client/**/*
      - src/ResQ.Viz.Web/vite.config.ts
      - src/ResQ.Viz.Web/tsconfig.json
      - src/ResQ.Viz.Web/package.json
      - src/ResQ.Viz.Web/package-lock.json
      - src/ResQ.Viz.Web/knip.json

"area:tests":
  - changed-files:
    - any-glob-to-any-file: tests/**/*

"area:vendor":
  - changed-files:
    - any-glob-to-any-file: lib/**/*

# -- Category / infra labels ----------------------------------------------

"A-DevOps":
  - changed-files:
    - any-glob-to-any-file:
      - .github/workflows/**/*
      - .github/actions/**/*
      - .github/aw/**/*
      - .github/dependabot.yml
      - .github/actionlint.yaml
      - .git-hooks/**/*

"A-Build":
  - changed-files:
    - any-glob-to-any-file:
      - "**/*.csproj"
      - ResQ.Viz.sln
      - src/ResQ.Viz.Web/vite.config.ts
      - src/ResQ.Viz.Web/tsconfig.json

"C-Documentation":
  - changed-files:
    - any-glob-to-any-file:
      - "**/*.md"
      - docs/**/*

"C-Testing":
  - changed-files:
    - any-glob-to-any-file:
      - tests/**/*
      - src/ResQ.Viz.Web/client/__tests__/**/*
      - src/ResQ.Viz.Web/client/**/*.test.ts